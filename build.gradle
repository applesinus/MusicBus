import com.musicbus.gradle.PrepareNativeToolchainTask

plugins {
    id 'java'
}

group = 'com.musicbus'
version = '0.3.0'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

configurations {
    fabricBundle
    implementation.extendsFrom(fabricBundle)
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9'
    implementation 'org.ow2.asm:asm-commons:9.9'
    fabricBundle 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def zigVersion = '0.17.1'
def zigArchiveName = "zig-x86_64-windows-${zigVersion}"
def zigUrl = "https://ziglang.org/download/${zigVersion}/${zigArchiveName}.zip"
def zigSha256 = 'B03F477A1943673E02ACA0F570E8030DFFD536CE1F45CBC4D3326EC31159562E'

def miniaudioUrl = 'https://raw.githubusercontent.com/mackron/miniaudio/0.11.22/miniaudio.h'
def miniaudioSha256 = '9019743287E443C55E5737A7297F38E5E358561701D6DB2D905AFB114390C410'

def stbVorbisUrl = 'https://raw.githubusercontent.com/nothings/stb/5c205738c191bcb0abc65c4febfa9bd25ff35234/stb_vorbis.c'
def stbVorbisSha256 = '4C7CB2FF1F7011E9D67950446B7EB9CA044F2E464D76BFBB0B84DD2E23E65636'

File nativeCacheDir = new File(gradle.gradleUserHomeDir, 'caches/musicbus-native')
File zigInstallDir = new File(nativeCacheDir, zigArchiveName)
File zigExeFile = new File(zigInstallDir, 'zig.exe')
File zigMarkerFile = new File(zigInstallDir, '.musicbus-extracted.ok')
File nativeDepsDir = new File(nativeCacheDir, 'deps-0.11.22')
File miniaudioHeaderFile = new File(nativeDepsDir, 'miniaudio.h')
File stbVorbisSourceFile = new File(nativeDepsDir, 'stb_vorbis.c')

def nativeSourceFile = layout.projectDirectory.file('src/main/native/musicbus_player.c')
def nativeRcFile = layout.projectDirectory.file('src/main/native/musicbus_player.rc')
def nativeIconFile = layout.projectDirectory.file('src/main/native/musicbus.ico')
def nativeOutputRes = layout.buildDirectory.file('generated/native-obj/musicbus_player.res')
def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
def nativeOutputExe = generatedNativeResourcesDir.map {
    it.file('native/windows-x64/musicbus-player.exe')
}

def prepareNativeToolchain = tasks.register('prepareNativeToolchain', PrepareNativeToolchainTask) {
    group = 'build'
    description = 'Downloads and caches portable Zig and audio headers.'

    it.zigUrl.set(zigUrl)
    it.zigArchiveName.set(zigArchiveName)
    it.zigSha256.set(zigSha256)
    it.miniaudioUrl.set(miniaudioUrl)
    it.miniaudioSha256.set(miniaudioSha256)
    it.stbVorbisUrl.set(stbVorbisUrl)
    it.stbVorbisSha256.set(stbVorbisSha256)
    it.cacheRootPath.set(nativeCacheDir.absolutePath)
    it.zigExe.set(zigExeFile)
    it.installMarker.set(zigMarkerFile)
    it.miniaudioHeader.set(miniaudioHeaderFile)
    it.stbVorbisSource.set(stbVorbisSourceFile)
}

def compileNativeResources = tasks.register('compileNativeResources', Exec) {
    group = 'build'
    description = 'Compiles Windows .rc resources using portable zig rc.'

    dependsOn(prepareNativeToolchain)

    inputs.file(nativeRcFile)
    inputs.file(nativeIconFile)
    inputs.file(zigExeFile)
    outputs.file(nativeOutputRes)

    doFirst {
        nativeOutputRes.get().asFile.parentFile.mkdirs()
    }

    executable = zigExeFile.absolutePath
    args = [
        'rc',
        '/fo', nativeOutputRes.get().asFile.absolutePath,
        nativeRcFile.asFile.absolutePath
    ]
}

def compileNativePlayer = tasks.register('compileNativePlayer', Exec) {
    group = 'build'
    description = 'Compiles musicbus-player.exe using portable zig cc.'

    dependsOn(prepareNativeToolchain, compileNativeResources)

    inputs.property('version', project.version.toString())
    inputs.file(nativeSourceFile)
    inputs.file(nativeOutputRes)
    inputs.file(miniaudioHeaderFile)
    inputs.file(stbVorbisSourceFile)
    inputs.file(zigExeFile)
    outputs.file(nativeOutputExe)

    executable = zigExeFile.absolutePath
    args = [
        'cc',
        '-target', 'x86_64-windows-gnu',
        '-O2',
        '-s',
        '-std=c11',
        '-Wall',
        '-Wextra',
        '-DUNICODE',
        '-D_UNICODE',
        '-DWIN32_LEAN_AND_MEAN',
        "-DMUSICBUS_VERSION_RAW=${project.version}",
        '-I', nativeDepsDir.absolutePath,
        '-Wl,--subsystem,windows',
        nativeSourceFile.asFile.absolutePath,
        nativeOutputRes.get().asFile.absolutePath,
        '-o', nativeOutputExe.get().asFile.absolutePath,
        '-lole32',
        '-loleaut32',
        '-luser32',
        '-lgdi32',
        '-lshell32',
        '-luuid'
    ]
}

sourceSets {
    main {
        resources {
            srcDir(generatedNativeResourcesDir)
        }
    }
    fabric {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    fabricCompileOnly 'net.fabricmc:fabric-loader:0.19.1'
    fabricCompileOnly 'net.fabricmc:sponge-mixin:0.17.+'
    fabricCompileOnly 'org.ow2.asm:asm-tree:9.9'
}

tasks.named('processResources') {
    dependsOn(compileNativePlayer)
}

tasks.named('processFabricResources', ProcessResources) {
    def modVersion = project.version.toString()
    inputs.property('version', modVersion)
    filesMatching('fabric.mod.json') {
        expand(version: modVersion)
    }
}

jar {
    archiveClassifier = ''

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    manifest {
        attributes(
            'Main-Class': 'com.musicbus.installer.MusicBusInstaller',
            'Premain-Class': 'com.musicbus.MusicBusAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version.toString()
        )
    }
}

def fabricJar = tasks.register('fabricJar', Jar) {
    group = 'build'
    description = 'Builds the Fabric mod JAR without bundling ASM or the standalone installer.'

    dependsOn(tasks.named('classes'), tasks.named('fabricClasses'))

    archiveClassifier = 'fabric'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude 'com/musicbus/MusicBusAgent.class'
        exclude 'com/musicbus/MusicBusAgent$*.class'
        exclude 'com/musicbus/installer/**'
    }

    from(sourceSets.fabric.output)

    from {
        configurations.fabricBundle.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    manifest {
        attributes(
            'Implementation-Title': "${project.name}-fabric",
            'Implementation-Version': project.version.toString()
        )
    }
}

tasks.named('assemble') {
    dependsOn(fabricJar)
}